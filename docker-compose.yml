version: "3.9"

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://distrixs:${POSTGRES_PASSWORD}@db:5432/distrixs_crm
    depends_on:
      db:
        condition: service_healthy
    # Alleen op localhost bereikbaar; extern verkeer loopt via nginx (TLS + headers)
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - crm

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: distrixs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: distrixs_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distrixs -d distrixs_crm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - crm

volumes:
  pgdata:

networks:
  crm:
